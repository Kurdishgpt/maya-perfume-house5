kind = "web"
previewPath = "/"
title = "Maya Perfume House"
description = "A bilingual perfume storefront for Maya Collection, with product browsing, wishlists, shopping bag and checkout, fragrance guides, and a protected admin area."
version = "1.0.0"
id = "artifacts/maya-perfume-shop"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22746

[services.development]
run = "pnpm --filter @workspace/maya-perfume-shop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maya-perfume-shop", "run", "build" ]
serve = "static"
publicDir = "artifacts/maya-perfume-shop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22746"
BASE_PATH = "/"
